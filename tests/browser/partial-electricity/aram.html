<!doctype html>
<html lang="hu">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <base href="/" />
    <title>Részéves áramfogyasztás – teszt</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module">
      const { initialState } = await import("/src/electricity/calculator.ts");
      const { yearFor, today } = await import("/src/calendar.ts");
      const state = initialState();
      state.year = yearFor(today()) - 1;
      state.points[0].eligibleFrom = `${state.year}-11-01`;
      state.points[0].eligibleTo = `${state.year}-12-01`;
      state.points[0].annualEstimate = "2400";
      state.stats.people = "2";
      state.stats.floorArea = "100";
      let saved = JSON.stringify(state);
      const get = Storage.prototype.getItem;
      const set = Storage.prototype.setItem;
      Storage.prototype.getItem = function (key) {
        return key === "rezsi-electricity.v1" ? saved : get.call(this, key);
      };
      Storage.prototype.setItem = function (key, value) {
        if (key === "rezsi-electricity.v1") saved = String(value);
        else set.call(this, key, value);
      };
      await import("/src/main.ts");
    </script>
  </body>
</html>
